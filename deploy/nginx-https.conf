server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/custom-attendance/acme/live/custom-attendance/fullchain.pem;
    ssl_certificate_key /etc/custom-attendance/acme/live/custom-attendance/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
